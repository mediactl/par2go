name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      PAR2GO_LIB: ${{ github.workspace }}/shim/out/libpar2shim.so
      PAR2GO_REQUIRE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build libpar2shim.so in debian:bookworm
        run: shim/build-in-docker.sh
      - name: Install par2cmdline-turbo
        run: hack/install-par2.sh
      - name: Test with cgo and the race detector
        run: go test -race -count=1 ./...
      - name: Test without cgo (production)
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
