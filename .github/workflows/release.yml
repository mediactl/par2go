name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      PAR2GO_LIB: ${{ github.workspace }}/shim/out/libpar2shim.so
      PAR2GO_LIBPAR2_DIR: ${{ github.workspace }}/shim/out
      PAR2GO_REQUIRE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build libpar2shim.so in debian:bookworm
        run: shim/build-in-docker.sh
      - name: Install par2cmdline-turbo
        run: hack/install-par2.sh
      # The artifact a release ships is the one these tests ran against.
      - name: Test the built library with cgo and the race detector
        run: go test -race -count=1 ./...
      - name: Test the built library without cgo
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...
      - name: Name the assets for their architecture
        run: |
          cp shim/out/libpar2shim.so libpar2shim-linux-${{ matrix.arch }}.so
          cp shim/out/libpar2.so libpar2-linux-${{ matrix.arch }}.so
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            libpar2shim-linux-${{ matrix.arch }}.so
            libpar2-linux-${{ matrix.arch }}.so
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - run: sha256sum libpar2shim-linux-*.so libpar2-linux-*.so > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes libpar2shim-linux-*.so libpar2-linux-*.so SHA256SUMS
